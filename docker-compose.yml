version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fantasy
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fantasy
      SPRING_DATASOURCE_USERNAME: fantasy
      SPRING_DATASOURCE_PASSWORD: fantasy
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  pgdata:
