<div class="player-list__header">
  <mat-form-field appearance="outline" class="player-list__search">
    <mat-label>Buscar jugador</mat-label>
    <input
      matInput
      type="text"
      placeholder="Nombre, equipo o posición"
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <a mat-flat-button color="primary" routerLink="/players/new" class="player-list__new-button">
    <mat-icon>add</mat-icon>
    Nuevo jugador
  </a>
</div>

@if (loading()) {
  <app-status-message mode="loading" message="Cargando jugadores..."></app-status-message>
} @else if (error()) {
  <app-status-message
    mode="error"
    message="No se ha podido conectar con el backend. Inténtalo de nuevo más tarde."
  ></app-status-message>
} @else if (filteredPlayers().length === 0) {
  <app-status-message
    mode="empty"
    message="No hay jugadores que coincidan con la búsqueda."
  ></app-status-message>
} @else {
  <mat-nav-list>
    @for (player of filteredPlayers(); track player.id) {
      <a mat-list-item [routerLink]="['/players', player.id]">
        <span matListItemTitle>{{ player.name }}</span>
        <span matListItemLine>{{ player.team }} · {{ player.position }}</span>
      </a>
    }
  </mat-nav-list>
}
